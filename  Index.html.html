<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Imashi ❤️</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; font-family: 'Poppins', sans-serif; }
    body {
      margin: 0; height: 100vh;
      background: radial-gradient(circle at top, #ff9a9e, #fad0c4);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .card {
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(18px);
      border-radius: 25px;
      padding: 35px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.25);
      max-width: 360px;
      animation: float 4s ease-in-out infinite;
    }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
    h1,p { color:#fff }
    .buttons{ position:relative; height:120px }
    button{
      border:none; padding:14px 28px; border-radius:50px;
      font-size:1.05rem; cursor:pointer; position:absolute;
    }
    #yes{
      background:linear-gradient(135deg,#ff416c,#ff4b2b);
      color:white; left:50%; transform:translateX(-50%);
      box-shadow:0 0 25px rgba(255,75,43,.9);
    }
    #no{
      background:rgba(255,255,255,.9);
      color:#ff416c; right:5%; top:60px;
    }
    .reveal{ display:none }
    .photo{
      width:100%; border-radius:18px; margin-top:15px;
      box-shadow:0 15px 40px rgba(0,0,0,.35);
    }
    .message{ color:#fff; margin-top:15px; line-height:1.5 }
  </style>
</head>
<body>

<audio id="loveSound" src="https://assets.mixkit.co/sfx/preview/mixkit-achievement-bell-600.mp3"></audio>

<div class="card">
  <h1>Imashi 💖</h1>
  <p>Will you be my Valentine?<br><b>— Mr. Valentine</b></p>

  <div class="buttons">
    <button id="yes">YES 💘</button>
    <button id="no">NO 🙃</button>
  </div>

  <div class="reveal">
    <img src="imashi-us.jpg" class="photo">
    <div class="message">
      Imashi, every moment with you feels like home.<br>
      Choosing you today and always.<br>
      <b>— Mr. Valentine ❤️</b>
    </div>
  </div>
</div>

<script>
const noBtn=document.getElementById("no");
const yesBtn=document.getElementById("yes");
const reveal=document.querySelector(".reveal");
const sound=document.getElementById("loveSound");

noBtn.addEventListener("mouseover",()=>move());
noBtn.addEventListener("touchstart",()=>move());

function move(){
  noBtn.style.left=Math.random()*(window.innerWidth-120)+"px";
  noBtn.style.top=Math.random()*(window.innerHeight-120)+"px";
}

yesBtn.addEventListener("click",()=>{
  document.querySelector(".buttons").style.display="none";
  sound.play(); reveal.style.display="block";
});
</script>
</body>
</html>
